# Fly.io deployment for the Kibana Banking MCP remote endpoint.
#
# Quick start:
#   fly launch --no-deploy --copy-config --name <your-app-name>
#   fly secrets set \
#     KIBANA_URL=https://kibana.bankstr.xyz \
#     ELASTICSEARCH_URL=https://es.bankstr.xyz:9200 \
#     KIBANA_API_KEY=... \
#     MCP_AUTH_TOKEN="$(openssl rand -hex 32)"
#   fly deploy
#
# Endpoint after deploy: https://<your-app-name>.fly.dev/mcp
# Health probe:          https://<your-app-name>.fly.dev/healthz
#
# Secrets are NEVER stored in this file — set them with `fly secrets set`.

app = "kibana-banking-mcp"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  # Keep one machine always running so streaming MCP/SSE sessions are never
  # dropped by scale-to-zero.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 150

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
